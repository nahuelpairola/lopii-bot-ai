port="80"

[database]
host     = "localhost"
port     = 5432
name     = "lopiibot"
user     = "lopiibot"
password = "lopiibot"
runMigrations = true

[telegram]
username="Lopiipersonalfinanceslocalbot"
token=""

[groq]
apiKey = ""
baseUrl = "https://api.groq.com/openai/v1"
# createModel NO puede ser el mismo que agentModel: el agente parkea en un wizard y el
# wizard clasifica DENTRO del mismo turno, así que compartir modelo hace que la segunda
# llamada rebote contra el cupo que reservó la primera. Lo defiende
# TestEveryConfigFile_HasNoSameTurnModelCollision.
createModel = "openai/gpt-oss-120b"
updateModel = "openai/gpt-oss-20b"
queryModel = "openai/gpt-oss-120b"
agentModel = "openai/gpt-oss-20b"
# Cuando el principal rebota por CUPO, el loop se corre a estos, en orden. Los
# techos de Groq son POR MODELO —verificado leyendo los headers: 8.000 TPM para
# cada gpt-oss, y TPD independiente— así que un 429 en uno no dice nada del otro.
# Van explícitos y no por default para que la prueba del fallback no esté
# probando, de paso, el parseo de viper.
#
# Un solo suplente por cadena: quedan DOS modelos usables, así que el segundo
# paso repetiría el bucket que acaba de rebotar y no rescata nada. Estuvo un
# tiempo como ["gpt-oss-20b", "gpt-oss-20b"] — artefacto de reemplazar el
# llama-3.3-70b dado de baja (fc300ab) sobre una lista que ya lo tenía.
agentFallbackModels = ["openai/gpt-oss-120b"]
queryFallbackModels = ["openai/gpt-oss-20b"]
narrationModel = "openai/gpt-oss-20b"
# El clasificador va en OTRO modelo a proposito: el techo de TPM de Groq es por
# modelo, y el loop ya entra al suyo una vez por minuto y medio.
classifierModel = "openai/gpt-oss-20b"
timeoutSeconds = 10

[query]
historyTtlMinutes = 10
historyLimit = 5

[reminders]
sweepIntervalMinutes = 5

[log]
level = "debug"
format = "text"
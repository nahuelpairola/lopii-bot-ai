env="local"

[server]
baseHost="https://31pk7cpc-80.brs.devtunnels.ms"
port="80"

[database]
host     = "localhost"
port     = 5432
name     = "lopiibot"
user     = "lopiibot"
password = "lopiibot"
runMigrations = true

[telegram]
username="Lopiipersonalfinanceslocalbot"
token=""

[groq]
apiKey = ""
baseUrl = "https://api.groq.com/openai/v1"
createModel = "openai/gpt-oss-20b"
updateModel = "openai/gpt-oss-20b"
queryModel = "openai/gpt-oss-120b"
agentModel = "openai/gpt-oss-20b"
# Cuando el principal rebota por CUPO, el loop se corre a estos, en orden. Los
# techos de Groq son POR MODELO —verificado leyendo los headers: 8.000 TPM para
# cada gpt-oss, 12.000 para el llama-70b, y TPD independiente— así que un 429 en
# uno no dice nada del otro. Van explícitos y no por default para que la prueba
# del fallback no esté probando, de paso, el parseo de viper.
agentFallbackModels = ["openai/gpt-oss-120b", "llama-3.3-70b-versatile"]
queryFallbackModels = ["llama-3.3-70b-versatile", "openai/gpt-oss-20b"]
# El clasificador va en OTRO modelo a proposito: el techo de TPM de Groq es por
# modelo, y el loop ya entra al suyo una vez por minuto y medio.
classifierModel = "llama-3.3-70b-versatile"
timeoutSeconds = 10

[query]
historyTtlMinutes = 10
historyLimit = 5

[reminders]
sweepIntervalMinutes = 5

[log]
level = "debug"
format = "text"
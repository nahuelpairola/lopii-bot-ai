env="local"

[server]
baseHost="https://31pk7cpc-80.brs.devtunnels.ms"
port="80"

[database]
host     = "localhost"
port     = 5432
name     = "lopiibot"
user     = "lopiibot"
password = "lopiibot"
runMigrations = true

[telegram]
username="Lopiipersonalfinanceslocalbot"
token=""

[groq]
apiKey = ""
baseUrl = "https://api.groq.com/openai/v1"
routerModel = "openai/gpt-oss-20b"
createModel = "openai/gpt-oss-20b"
updateModel = "openai/gpt-oss-20b"
deleteModel = "llama-3.1-8b-instant"
queryModel = "openai/gpt-oss-120b"
agentModel = "openai/gpt-oss-20b"
# El clasificador va en OTRO modelo a proposito: el techo de TPM de Groq es por
# modelo, y el loop ya entra al suyo una vez por minuto y medio.
classifierModel = "llama-3.3-70b-versatile"
timeoutSeconds = 10

[agent]
# routeCreateToLoop manda CREATE por el loop unificado (etapa 3) en vez del
# camino router+Call 2. Es el interruptor de emergencia: las etapas 2 y 3
# despliegan juntas, asi que sin esto una caida de create_inserted no se puede
# atribuir a una de las dos. Apagarlo deja la etapa 2 viva y CREATE como estaba.
routeCreateToLoop = true

[query]
historyTtlMinutes = 10
historyLimit = 5

[reminders]
sweepIntervalMinutes = 5

[log]
level = "debug"
format = "text"